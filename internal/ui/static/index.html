<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121210" media="(prefers-color-scheme: dark)">
<title>Relay</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main id="login" class="login" hidden>
  <h1>Relay</h1>
  <button id="login-btn" class="primary" type="button">Sign in</button>
  <p id="login-msg" class="msg" role="status"></p>
  <details id="register">
    <summary>Add a passkey</summary>
    <input id="reg-token" type="password" autocomplete="off" spellcheck="false" placeholder="API token" aria-label="API token">
    <button id="reg-btn" type="button">Add</button>
    <p id="reg-msg" class="msg" role="status"></p>
  </details>
</main>

<div id="app" hidden>
  <header class="bar">
    <button id="prev" class="icon" type="button" aria-label="Previous">&#8249;</button>
    <button id="range" class="range" type="button" title="Today"></button>
    <button id="next" class="icon" type="button" aria-label="Next">&#8250;</button>
    <div class="views" role="tablist" aria-label="View">
      <button id="v-week" type="button" role="tab">Week</button>
      <button id="v-day" type="button" role="tab">Day</button>
    </div>
  </header>
  <nav id="filters" class="filters" aria-label="Networks"></nav>
  <section id="cal" class="cal"></section>
  <button id="logout" class="out" type="button">Sign out</button>
</div>

<dialog id="preview" tabindex="-1">
  <form method="dialog"><button class="icon close" aria-label="Close">&times;</button></form>
  <div id="preview-body"></div>
</dialog>
</body>
</html>
