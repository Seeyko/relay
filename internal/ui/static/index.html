<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Relay</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main id="login" class="login" hidden>
  <div class="login-card">
    <h1>Relay</h1>
    <p class="muted">Scheduled posts, across every network.</p>
    <button id="login-btn" class="primary" type="button">Sign in with a passkey</button>
    <p id="login-msg" class="msg" role="status"></p>
    <details id="register">
      <summary>Add a passkey</summary>
      <p class="muted small">Needs the admin API token (RELAY_API_TOKEN). It is sent once to this server and never stored in the browser.</p>
      <label>API token <input id="reg-token" type="password" autocomplete="off" spellcheck="false"></label>
      <label>Name for this key <input id="reg-name" type="text" maxlength="60" placeholder="MacBook Touch ID"></label>
      <button id="reg-btn" type="button">Create passkey</button>
      <p id="reg-msg" class="msg" role="status"></p>
    </details>
  </div>
</main>

<div id="app" hidden>
  <header class="bar">
    <strong class="brand">Relay</strong>
    <div class="nav">
      <button id="prev" type="button" aria-label="Previous">&#8249;</button>
      <button id="today" type="button">Today</button>
      <button id="next" type="button" aria-label="Next">&#8250;</button>
      <span id="range" class="range"></span>
    </div>
    <div class="views" role="tablist">
      <button id="v-week" type="button" role="tab">Week</button>
      <button id="v-day" type="button" role="tab">Day</button>
    </div>
    <button id="logout" type="button" class="ghost">Sign out</button>
  </header>
  <div id="filters" class="filters"></div>
  <section id="cal" class="cal"></section>
</div>

<dialog id="preview">
  <form method="dialog"><button class="close" aria-label="Close">&times;</button></form>
  <div id="preview-body"></div>
</dialog>
</body>
</html>
