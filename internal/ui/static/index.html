<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<title>Relay</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mockups.css">
<script src="app.js" defer></script>
<script src="mockups.js" defer></script>
</head>
<body>
<main id="login" class="login" hidden>
  <div class="mark" aria-hidden="true"></div>
  <button id="login-btn" class="primary" type="button"></button>
  <form id="email-form" class="register" hidden>
    <input id="email-input" type="email" autocomplete="email" spellcheck="false" required>
    <button id="email-btn" type="submit"></button>
  </form>
  <p id="login-msg" class="msg" role="status"></p>
  <button id="reg-toggle" class="link" type="button" hidden></button>
  <form id="register" class="register" hidden>
    <input id="reg-token" type="password" autocomplete="off" spellcheck="false" required>
    <button id="reg-btn" type="submit"></button>
  </form>
</main>

<main id="landing" class="login" hidden>
  <div class="mark" aria-hidden="true"></div>
  <p id="landing-email" class="landing-email"></p>
  <form id="landing-form" class="landing-form">
    <input id="landing-name" type="text" autocomplete="name" maxlength="60" hidden>
    <button id="landing-btn" class="primary" type="submit"></button>
  </form>
  <p id="landing-msg" class="msg" role="status"></p>
</main>

<div id="app" hidden>
  <header class="bar">
    <button id="prev" class="icon" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button id="range" class="range" type="button"></button>
    <button id="next" class="icon" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="spacer"></div>
    <div class="seg" role="tablist">
      <button id="v-week" type="button" role="tab"></button>
      <button id="v-day" type="button" role="tab"></button>
    </div>
    <button id="v-drafts" class="drafts-btn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4"/></svg><span id="drafts-label"></span><b id="drafts-count" hidden></b></button>
    <button id="accounts-btn" class="icon" type="button" aria-label="Accounts" hidden></button>
    <button id="apps-btn" class="icon" type="button" aria-label="Apps" hidden></button>
    <button id="team-btn" class="icon" type="button" aria-label="Team" hidden></button>
    <button id="me-btn" class="icon" type="button" aria-label="Account"></button>
  </header>
  <nav id="strip" class="strip" aria-label="Days"></nav>
  <main id="cal" class="cal"></main>
</div>

<dialog id="preview" class="sheet">
  <div id="preview-body"></div>
</dialog>
</body>
</html>
